<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub 星榜 — 开源项目 Star 排行 · 中文版</title>
<meta name="description" content="每日更新的 GitHub 开源项目 Star 排行榜，中文简介，总榜与各语言分榜。">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>★</text></svg>">
<style>
.github-source { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; width: 44px; height: 44px; box-sizing: border-box; color: inherit; border-radius: 8px; vertical-align: middle; text-decoration: none; }
.github-source:hover { opacity: .7; }
.github-source:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
.github-source svg { display: block; flex: none; }
.github-source-floating { position: fixed; z-index: 1100; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); color: #fff; background: #24292f; border: 1px solid #ffffff40; box-shadow: 0 2px 8px #0002; }
</style>
</head>
<body>
<header class="masthead">
  <div class="masthead-inner">
    <div style="display:flex;justify-content:flex-end"><a class="github-source" href="https://github.com/yaowenhu-pm/github-ranking-cn" target="_blank" rel="noopener noreferrer" aria-label="在 GitHub 查看项目源码（新标签页）" title="GitHub · 项目源码"><svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.65 7.65 0 0 1 8 3.86c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg></a></div>
    <p class="kicker">每日更新 · 中文简介 · THE GITHUB STAR INDEX</p>
    <h1>GitHub<span class="star">★</span>星榜</h1>
    <p class="dateline" id="dateline">数据加载中</p>
  </div>
</header>

<nav class="tabs" id="tabs" aria-label="榜单切换"></nav>

<div class="toolbar">
  <input type="search" id="search" placeholder="在当前榜单里搜索项目名或简介" aria-label="搜索">
  <span class="count" id="count"></span>
</div>

<main>
  <ol class="ranking" id="ranking"></ol>
  <p class="empty" id="empty" hidden>没有匹配的项目</p>
</main>

<footer>
  <p>数据来自 GitHub Search API · 中文导读由 Claude 撰写 · 致敬 <a href="https://github.com/EvanLi/Github-Ranking">EvanLi/Github-Ranking</a></p>
  <p><a href="https://github.com/yaowenhu-pm/github-ranking-cn">本站源码</a> · 每日 08:30（北京时间）自动更新</p>
</footer>

<script src="assets/app.js"></script>
</body>
</html>
